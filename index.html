<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find toilet – København og Frederiksberg</title>
<meta name="description" content="Find det nærmeste offentlige toilet i København og på Frederiksberg.">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
<link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="main">
  <div id="map" aria-label="Kort over toiletter"></div>

  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.5" r="1.8"/><path d="M10 8h4l1 6h-2l-1 7M11 21l-1-7h-2"/></svg></span><h1>Find toilet</h1></div>
    <button id="btnInfo" class="icon-btn" aria-label="Om appen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
  </header>
  <div class="filters" role="group" aria-label="Vis kun">
    <button class="chip" data-filter="wheelchair" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4" r="1.8"/><path d="M11 7v6h6l2 5"/><path d="M8.5 10.5a5.5 5.5 0 1 0 7 7"/></svg>Handicapvenligt</button>
    <button class="chip" data-filter="free" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.2a3 3 0 0 0-2.5-1.2c-1.7 0-2.8.9-2.8 2s1 1.6 2.8 2 2.8 1 2.8 2.1-1.2 2-2.8 2a3 3 0 0 1-2.6-1.3M12 6.5v1.5M12 16v1.5"/></svg>Gratis</button>
    <button class="chip" data-filter="open" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Åbent nu</button>
    <button class="chip" data-filter="changing" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="2.5"/><path d="M4 20c0-4 2-7 5-7s5 3 5 7M15 11h5v9"/></svg>Puslebord</button>
  </div>
  <div id="mapHint" class="map-hint" role="status" hidden></div>
  <button id="btnLocate" class="fab" aria-label="Find min position" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg></button>

  <section id="panel" class="panel" aria-live="polite">
    <div class="grab" aria-hidden="true"></div>
    <!-- Start -->
    <div id="viewStart" class="view">
      <h2 class="h">Find det nærmeste toilet</h2>
      <p class="lead">550 offentlige toiletter i København og på Frederiksberg – med handicapadgang, pris og åbningstid.</p>
      <button id="btnFind" class="btn-big primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg>Find nærmeste toilet</button>
      <button id="btnTap" class="btn-big secondary">Vælg selv på kortet</button>
      <p class="small privacy"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>Din position bliver kun på din telefon.</p>
    </div>

    <!-- Nærmeste -->
    <div id="viewNear" class="view" hidden>
      <div id="gpsStatus" class="gps-status"></div>
      <div id="nearestCard"></div>
      <h2 class="h-others" id="othersTitle">Andre i nærheden</h2>
      <ol id="othersList" class="others"></ol>
    </div>

    <!-- Vis vej -->
    <div id="viewNav" class="view" hidden>
      <div class="nav-head">
        <div class="arrow-wrap"><div id="navArrow" class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h14M12 6l6 6-6 6"/></svg></div></div>
        <div>
          <div id="navDist" class="nav-dist">– m</div>
          <div id="navTime" class="nav-time"></div>
        </div>
      </div>
      <div id="navDir" class="nav-dir"></div>
      <div id="navName" class="nav-name"></div>
      <div id="navNote" class="small"></div>
      <button id="btnRoute" class="btn-big secondary">Tegn ruten ad gaderne</button>
      <div class="row2">
        <a id="lnkGoogle" class="btn-big ext" target="_blank" rel="noopener">Google Maps</a>
        <a id="lnkApple" class="btn-big ext" target="_blank" rel="noopener">Apple Kort</a>
      </div>
      <button id="btnStop" class="btn-big ghost">Afslut vejvisning</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <div id="dlgBody"></div>
  <form method="dialog"><button class="btn-big primary" id="dlgOk">OK</button></form>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/markercluster/leaflet.markercluster.js"></script>
<script src="hours.js"></script>
<script src="data/toiletter.js"></script>
<script src="config.js"></script>
<script src="reviews.js"></script>
<script src="app.js"></script>
</body>
</html>
